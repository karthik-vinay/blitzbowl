<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLITZ BOWL — Arcade Flag Football</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0e1c;--bezel:#1a1f3a;--ink:#f7edc9;--gold:#ffc857;--pink:#ff4fa3;--cyan:#4de2ff;--lime:#b9e66b;--f:"Press Start 2P","Courier New",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;color:var(--ink);background:radial-gradient(circle at 50% 0,#27204f,var(--bg) 60%);font-family:var(--f)}
.cab{width:min(100%,1040px);background:var(--bezel);border:4px solid #3b4276;border-radius:14px;padding:12px;box-shadow:0 0 0 5px #070918,0 0 40px #ff4fa355,0 0 80px #4de2ff33}
.mq{text-align:center;padding:8px 4px 12px}
.logo{font-size:clamp(16px,3.6vw,30px);color:var(--gold);letter-spacing:2px;text-shadow:3px 3px #8a2f5f,0 0 14px #ffc857aa;animation:glow 2s ease-in-out infinite}
.sub{font-size:clamp(7px,1.3vw,10px);color:var(--cyan);margin-top:8px;letter-spacing:2px}
@keyframes glow{50%{text-shadow:3px 3px #8a2f5f,0 0 26px #ff4fa3,0 0 6px #fff}}
@keyframes blink{50%{opacity:0}}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin-bottom:8px}
.st{background:#070918;border:2px solid #3b4276;padding:7px 6px;text-align:center}
.st small{display:block;font-size:7px;color:var(--cyan);margin-bottom:6px}
.st b{font-size:11px;color:#fff4c7;font-weight:400}
.st.pk b{color:var(--pink)}
.screen{position:relative;border:4px solid #05060f;border-radius:6px;overflow:hidden;background:#000}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(#0000 0 2px,#0004 2px 3px),radial-gradient(ellipse at center,#0000 55%,#000b 100%)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}
.ov{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:12px;background:#050714d9;text-align:center}
.pn{width:min(100%,520px);border:4px solid var(--cyan);background:#10142d;padding:22px 16px;box-shadow:0 0 24px #4de2ff77,8px 8px 0 #050714}
.pn h1{margin:0 0 14px;font-size:clamp(20px,5vw,36px);line-height:1.2;color:var(--gold);text-shadow:3px 3px #8a2f5f}
.pn p{font-size:9px;line-height:2;color:#e0e8c8;margin:10px 0}
.hs{color:var(--pink)!important}
.pn{max-height:100%;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.sm{cursor:pointer;font:inherit;font-size:9px;color:#fff;background:#232a55;border:2px solid var(--cyan);padding:8px 10px}
.sm:hover{background:#2f3a7a}
input,select{font:inherit;font-size:10px;color:#fff;background:#070918;border:2px solid var(--cyan);padding:8px;text-transform:uppercase;max-width:100%}
.coin{width:64px;height:64px;margin:18px auto;border-radius:50%;background:var(--gold);border:4px solid #fff0b6;box-shadow:inset -6px -6px #c98b1e;animation:flip 1.6s ease-in-out 1}
@keyframes flip{to{transform:rotateY(1800deg)}}
.btn{cursor:pointer;border:3px solid #fff0b6;background:var(--gold);color:#241a2e;padding:12px 16px;font:inherit;font-size:12px;box-shadow:4px 4px 0 #050714;animation:blink 1s steps(1) infinite}
.btn:hover{filter:brightness(1.1)}
.ctl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 2px 2px;font-size:8px;line-height:2.1;color:#b9c3e6}
kbd{font:inherit;color:#161a33;background:var(--ink);padding:2px 5px;box-shadow:2px 2px #050714}
.touch{display:none;gap:10px;margin-top:10px}
.touch button{flex:1;padding:16px;font:inherit;font-size:12px;color:#fff;border:3px solid;background:#10142d;border-radius:8px}
#tp{border-color:var(--gold)}#tj{border-color:var(--pink)}
@media(pointer:coarse){.touch{display:flex}}
@media(max-width:560px){body{padding:6px}.cab{padding:7px}.st b{font-size:9px}}
</style>
</head>
<body>
<div class="cab">
  <div class="mq"><div class="logo">★ BLITZ BOWL ★</div><div class="sub">5-ON-5 ARCADE FLAG FOOTBALL • INSERT COIN</div></div>
  <div class="hud">
    <div class="st pk"><small>1UP SCORE</small><b id="score">000000</b></div>
    <div class="st"><small>HI-SCORE</small><b id="hi">000000</b></div>
    <div class="st"><small>LEVEL</small><b id="level">1</b></div>
    <div class="st"><small>LIVES</small><b id="lives">♥♥♥</b></div>
    <div class="st"><small>DOWN</small><b id="down">1ST &amp; 10</b></div>
    <div class="st"><small>TIME</small><b id="time">90</b></div>
  </div>
  <div class="screen">
    <canvas id="game" width="960" height="540" aria-label="Blitz Bowl arcade football game"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <div class="touch"><button id="tj">JUKE</button><button id="tp">PASS</button></div>
  <div class="ctl">
    <div><kbd>WASD</kbd> <kbd>ARROWS</kbd> MOVE &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> THROW TO WR &nbsp; <kbd>SPACE</kbd> BEST OPEN<br><kbd>X</kbd> JUKE &nbsp; <kbd>SHIFT</kbd> SPRINT &nbsp; <kbd>P</kbd> PAUSE &nbsp; <kbd>M</kbd> MUTE &nbsp; <kbd>R</kbd> RESTART</div>
    <div style="text-align:right;color:#ffc857">TD +700 • 1ST DOWN +200 • COINS +25<br>NO TOUCHDOWN = NO COINS!</div>
  </div>
</div>
<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=960,H=540,F={x:42,y:48,w:876,h:444},YD=F.w/100,GOAL=F.x+F.w-50;
const $=id=>document.getElementById(id),keys=new Set(),FONT='"Press Start 2P","Courier New",monospace';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
let state='title',last=0,t=0,score=0,hi=0,lives=3,level=1,clock=90,down=1,combo=0,tds=0,los=F.x+90,fd=0;
let P,R=[],B,D=[],ball=null,tgt=0,anc=0,cd=0,cdn=0,coins=[],parts=[],pops=[],msg='',msgC='#ffe08a',msgT=0,flash=0,shake=0,hype=0,paused=false,wait=0,after=null,muted=false;
// ---- roster, playbook, shop, admin, online
const PL=[{id:'tb',n:'Tommy Brooks',num:12,c:'#4e8fe0',spd:1,st:1,jk:1,cost:0},{id:'ma',n:'Marco Alvarez',num:7,c:'#3fbf9f',spd:1.03,st:1,jk:1,cost:0},{id:'jj',n:'Jimmy Johnson',num:23,c:'#e0793e',spd:1.08,st:1.1,jk:.9,cost:300},{id:'do',n:'Dante Okafor',num:34,c:'#a76be0',spd:1.12,st:1.2,jk:.85,cost:600},{id:'rv',n:'Rex Vance',num:5,c:'#e0506b',spd:1.18,st:1.3,jk:.8,cost:1100},{id:'kn',n:'Kenji Nakamura',num:88,c:'#e0d04e',spd:1.25,st:1.45,jk:.7,cost:1800},{id:'sd',n:'Sam Delaney',num:1,c:'#4ee0e0',spd:1.33,st:1.6,jk:.6,cost:3000}];
const ROUTES={GO:{ox:235,ax:20,fx:1,ay:25,fy:1.3},SLANT:{ox:110,ax:40,fx:2.4,ay:70,fy:2.2},CURL:{ox:160,ax:55,fx:1.8,ay:35,fy:3},OUT:{ox:140,ax:25,fx:1.5,ay:90,fy:1.4},ZIG:{ox:190,ax:45,fx:2.6,ay:60,fy:2.9}};
const WR=[{n:'D. Pruitt',num:8,yb:.2},{n:'L. Marsh',num:81,yb:.5},{n:'C. Ortega',num:84,yb:.8}];
const CODES={ty4playing:400,nahidwin:1000,jj:600,v:2500};
let SV={coins:50,owned:['tb','ma'],sel:'tb',plan:['SLANT','CURL','GO'],used:[],hi:0},SEL,ol=null;
try{Object.assign(SV,JSON.parse(localStorage.getItem('pg_save')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pg_save',JSON.stringify(SV))}catch(e){}};
SEL=PL.find(p=>p.id===SV.sel)||PL[0];hi=SV.hi||0;
const nm=s=>{const a=s.split(' ');return a[0][0]+'. '+a.slice(1).join(' ')};
const show=s=>{$('ov').style.display='flex';$('ov').innerHTML=s},pn=s=>'<div class="pn">'+s+'</div>';
function titlePanel(){return pn(`<h1>BLITZ<br>BOWL</h1><p class="hs">★ ${SV.coins} COINS • HI ${String(hi).padStart(6,'0')}</p><p>YOUR QB: ${nm(SEL.n)} #${SEL.num}</p><button class="btn" data-a="solo">▶ SOLO GAME</button><div class="row"><button class="sm" data-a="online">ONLINE VS FRIEND</button><button class="sm" data-a="book">PLAYBOOK</button><button class="sm" data-a="shop">SHOP</button><button class="sm" data-a="admin">ADMIN</button></div><p style="color:#8e9ac8">5-ON-5 • BLUE BOMBERS VS GOLD RUSH</p>`)}
function bookPanel(){return pn(`<h1>PLAYBOOK</h1><p>PICK A ROUTE FOR EACH RECEIVER<br><span style="color:#8e9ac8">GO deep • SLANT quick • CURL stop-back • OUT sideline • ZIG weave</span></p>${WR.map((w,i)=>`<p>${i+1}. ${w.n} #${w.num}<br><select data-r="${i}">${Object.keys(ROUTES).map(k=>`<option${SV.plan[i]===k?' selected':''}>${k}</option>`).join('')}</select></p>`).join('')}<p style="color:#8fc0ff">OL: B. Hollis #55</p><div class="row"><button class="sm" data-a="shop">CHANGE QB</button><button class="btn" data-a="menu">DONE</button></div>`)}
function shopPanel(m=''){const bar=n=>'■'.repeat(Math.max(1,n));return pn(`<h1>SHOP</h1><p class="hs">★ ${SV.coins} COINS ${m?'• '+m:''}</p>${PL.map(p=>{const own=SV.owned.includes(p.id);return `<p style="text-align:left;border-bottom:1px solid #3b4276;padding-bottom:8px"><span style="color:${p.c}">#${p.num} ${nm(p.n)}</span><br>SPD ${bar(Math.round((p.spd-.95)*20))}<br>STA ${bar(Math.round(p.st*3))}<br>JUKE ${bar(Math.round((1.2-p.jk)*6))}<br><button class="sm" data-a="${own?'sel':'buy'}" data-id="${p.id}">${p.id===SEL.id?'EQUIPPED':own?'SELECT':'BUY ★'+p.cost}</button></p>`}).join('')}<button class="btn" data-a="menu">BACK</button>`)}
function adminPanel(m=''){return pn(`<h1>ADMIN</h1><p>ENTER A CODE FOR BONUS COINS</p><p><input id="cd" maxlength="20" autocomplete="off" placeholder="CODE"> <button class="sm" data-a="redeem">REDEEM</button></p><p class="hs">${m}</p><p>★ ${SV.coins} COINS</p><button class="btn" data-a="menu">BACK</button>`)}
function onlinePanel(m=''){return pn(`<h1>ONLINE</h1><p>EACH TEAM GETS ONE DRIVE<br>HIGHER SCORE WINS • COIN TOSS PICKS WHO GOES FIRST</p><button class="btn" data-a="host">CREATE ROOM</button><p>OR JOIN A FRIEND</p><p><input id="rc" maxlength="4" placeholder="CODE"> <button class="sm" data-a="join">JOIN</button></p><p class="hs">${m}</p><button class="sm" data-a="menu">BACK</button>`)}
function endGame(){
  state='over';const nh=score>hi;if(nh)hi=score;const earn=tds>0?Math.floor(score/10):0;SV.coins+=earn;SV.hi=hi;save();sfx.over();hud();
  if(ol){ol.mine=score;ol.td=tds>0;ol.g.emit('done',{s:score}).catch(()=>{});olFlow();return}
  show(pn(`<h1>GAME<br>OVER</h1><p>FINAL SCORE<br><span style="font-size:22px;color:#ffc857">${String(score).padStart(6,'0')}</span></p><p>LEVEL ${level} • ${earn?'+'+earn+' COINS':'NO TD = NO COINS'}</p>${nh?'<p class="hs" style="animation:blink .6s steps(1) infinite">★ NEW HIGH SCORE ★</p>':''}<button class="btn" data-a="solo">PLAY AGAIN ↻</button><div class="row"><button class="sm" data-a="shop">SHOP</button><button class="sm" data-a="menu">MENU</button></div>`));
}
function lobby(){if(!ol||ol.first)return;show(pn(`<h1>ROOM ${ol.code.toUpperCase()}</h1><p>${ol.n>=2?'FRIEND CONNECTED!':'WAITING FOR FRIEND…<br>SHARE THIS CODE'}</p>${ol.n>=2?(ol.role==='host'?'<button class="btn" data-a="flip">FLIP COIN</button>':'<p>HOST FLIPS THE COIN…</p>'):''}<p><button class="sm" data-a="leave">LEAVE</button></p>`))}
function coinPanel(){
  show(pn('<h1>COIN TOSS</h1><div class="coin"></div><p id="ct">FLIPPING…</p>'));
  setTimeout(()=>{const e=$('ct');if(e&&ol)e.innerHTML=ol.first===ol.role?'YOU WIN THE TOSS!<br>YOU GET THE BALL FIRST':'OPPONENT WINS THE TOSS<br>THEY GET THE BALL FIRST'},1700);
  setTimeout(olFlow,3800);
}
function olFlow(){
  if(!ol||!ol.first||state==='playing')return;
  const first=ol.role===ol.first;
  if(ol.mine==null&&(first||ol.theirs!=null))return show(pn(`<h1>YOUR DRIVE</h1><p>${ol.theirs!=null?'BEAT '+ol.theirs+' TO WIN!':'SCORE AS MUCH AS YOU CAN!'}</p><button class="btn" data-a="drive">KICK OFF ▶</button>`));
  if(ol.mine==null)return show(pn(`<h1>THEIR DRIVE</h1><p>THEIR SCORE: <span id="ls">${ol.live}</span></p><p>WAITING FOR THEM TO FINISH…</p>`));
  if(ol.theirs==null)return show(pn(`<h1>YOU: ${ol.mine}</h1><p>OPPONENT DRIVING…<br>THEIR SCORE: <span id="ls">${ol.live}</span></p>`));
  const w=Math.sign(ol.mine-ol.theirs);if(w>0&&ol.td&&!ol.paid){ol.paid=1;SV.coins+=100;save()}
  show(pn(`<h1>${w>0?'YOU WIN!':w<0?'YOU LOSE':'TIE GAME'}</h1><p>YOU ${ol.mine} — ${ol.theirs} OPP</p>${w>0&&ol.td?'<p class="hs">+100 BONUS COINS</p>':'<p>NO TD = NO COINS</p>'}<button class="btn" data-a="menu">MENU</button>`));
}
async function netOpen(code,role){
  let room=null;try{room=await claude.use('room')}catch(e){}
  if(!room)return show(onlinePanel('ONLINE NEEDS THE SIGNED-IN SHARED LINK'));
  let g;try{g=await room.join('pg-'+code)}catch(e){return show(onlinePanel('COULD NOT JOIN ROOM'))}
  ol={g,role,code,n:1,mine:null,theirs:null,first:null,live:0};
  const cnt=l=>l.filter(p=>p.kind==='viewer').length;
  g.on('flip',m=>{if(m.isMe||!ol)return;ol.first=m.data.first;coinPanel()});
  g.on('st',m=>{if(m.isMe||!ol)return;ol.live=m.data.s;const e=$('ls');if(e)e.textContent=ol.live});
  g.on('done',m=>{if(m.isMe||!ol)return;ol.theirs=m.data.s;olFlow()});
  g.onPeers(c=>{if(!ol)return;ol.n=cnt(c.peers);lobby()});
  try{ol.n=Math.max(1,cnt(g.peers()))}catch(e){}
  lobby();
}
const act={
  solo(){ol=null;startGame()},
  menu(){if(ol&&ol.g){try{ol.g.leave()}catch(e){}}ol=null;state='title';show(titlePanel())},
  shop(m){show(shopPanel(m))},book(){show(bookPanel())},admin(m){show(adminPanel(m))},online(){show(onlinePanel())},
  buy(id){const p=PL.find(x=>x.id===id);if(SV.coins<p.cost){sfx.hit();return act.shop('NOT ENOUGH COINS!')}SV.coins-=p.cost;SV.owned.push(id);SV.sel=id;SEL=p;save();sfx.coin();act.shop('BOUGHT '+nm(p.n)+'!')},
  sel(id){SEL=PL.find(x=>x.id===id);SV.sel=id;save();act.shop()},
  redeem(){const c=$('cd').value.trim().toLowerCase();let m='INVALID CODE';if(CODES[c]){if(SV.used.includes(c))m='CODE ALREADY USED';else{SV.coins+=CODES[c];SV.used.push(c);save();m='+'+CODES[c]+' COINS!';sfx.td()}}act.admin(m)},
  host(){netOpen(Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz'[Math.random()*23|0]).join(''),'host')},
  join(){const c=$('rc').value.trim().toLowerCase();if(c.length!==4)return show(onlinePanel('ENTER THE 4-LETTER CODE'));netOpen(c,'guest')},
  flip(){if(!ol||ol.role!=='host'||ol.n<2)return;ol.first=Math.random()<.5?'host':'guest';ol.g.emit('flip',{first:ol.first}).catch(()=>{});coinPanel()},
  drive(){startGame()},leave(){act.menu()}
};
$('ov').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.id)});
$('ov').addEventListener('change',e=>{if(e.target.dataset.r!=null){SV.plan[+e.target.dataset.r]=e.target.value;save()}});
$('ov').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cd')act.redeem()});
// ---- chiptune sfx
let AC=null;
function tone(f,d=.1,type='square',v=.05,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const seq=(a,d=.1,ty='square',gap=.08)=>a.forEach((f,i)=>tone(f,d,ty,.05,0,i*gap));
const sfx={throw:()=>tone(300,.18,'square',.05,500),catch:()=>seq([660,990],.08,'square',.07),coin:()=>seq([988,1319],.08,'square',.06),down:()=>seq([523,659,784]),
td:()=>seq([523,659,784,1047,784,1047,1319],.12,'square',.09),hit:()=>tone(160,.28,'sawtooth',.08,-120),juke:()=>tone(900,.12,'triangle',.06,-600),
over:()=>seq([392,330,262,196],.25,'square',.2),start:()=>seq([262,330,392,523],.1,'square',.07)};
// ---- helpers
const mult=()=>1+Math.min(combo,4);
function banner(s,sec=1.2,c='#ffe08a'){msg=s;msgT=sec;msgC=c}
function pop(x,y,s,c='#fff0c6'){pops.push({x,y,s,c,l:1})}
function addPts(n,x,y,label){const v=n*mult();score+=v;pop(x,y,'+'+v+(label?' '+label:''),label?'#ffe45c':'#fff0c6')}
function burst(x,y,c,n=12,g=300){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(40,200);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:rnd(.4,.9),c,s:rnd(3,6),g})}}
function hud(){
  $('score').textContent=String(score).padStart(6,'0');$('hi').textContent=String(Math.max(hi,score)).padStart(6,'0');
  $('level').textContent=level;$('lives').textContent='♥'.repeat(Math.max(0,lives))||'—';
  const px=P?P.x:los;$('down').textContent=['1ST','2ND','3RD','4TH'][down-1]+' & '+Math.max(1,Math.ceil((fd-px)/YD));
  $('time').textContent=Math.ceil(clock);
}
function newPlay(keepY){
  const y=keepY&&P?P.y:F.y+F.h/2;
  P={x:los,y,has:true,inv:0,st:1,jk:0,jcd:0,jd:{x:1,y:0},num:SEL.num,nm:nm(SEL.n)};
  R=WR.map((w,i)=>({...ROUTES[SV.plan[i]],yb:w.yb,num:w.num,nm:w.n,ph:i*1.3,x:los+ROUTES[SV.plan[i]].ox,y:F.y+F.h*w.yb,gap:99,open:true}));R.forEach(r=>{r.x=clamp(los+r.ox+Math.sin(r.ph*r.fx)*r.ax,F.x+80,F.x+F.w-45);r.y=clamp(F.y+F.h*r.yb+Math.sin(r.ph*r.fy)*r.ay,F.y+25,F.y+F.h-25)});B={x:los-40,y};
  const n=5,ypos=[.5,.28,.15,.62,.85];D=[];
  for(let i=0;i<n;i++){const dy=F.y+F.h*ypos[i];D.push({x:Math.min(los+270+(i%2)*60+(i>1?60:0),GOAL-30),y:dy,hy:dy,role:i,sp:(i<2?68:74)+level*7,stun:0})}
  ball=null;coins=[];for(let i=0;i<6;i++)coins.push({x:rnd(los+120,GOAL-30),y:rnd(F.y+30,F.y+F.h-30)});
  hud();
}
function titlePanelOld(){return `<div class="pn"><h1>PIXEL<br>GRIDIRON</h1><p style="color:#8fc0ff">YOUR TEAM: BLUE BOMBERS<br>QB #12 • WR #8 #81 #84 • OL #55</p><p style="color:#ffc857">VS GOLD RUSH: 5 DEFENDERS<br>1 RUSHER • 1 SPY • 3 COVER MEN</p><p>PICK YOUR WR WITH 1 2 3 • TAP TO THROW</p><p class="hs">HI-SCORE ${String(hi).padStart(6,'0')}</p><button class="btn" data-start>PRESS START ▶</button><p style="color:#8e9ac8">1 PLAYER • 3 LIVES • 90 SEC + BONUS TIME</p></div>`}
$('ov').innerHTML=titlePanel();
$('ov').addEventListener('click',e=>{if(e.target.closest('[data-start]'))startGame()});
function startGame(){score=0;tds=0;lives=3;level=1;clock=90;down=1;combo=0;paused=false;wait=0;after=null;los=F.x+90;fd=los+10*YD;parts=[];pops=[];state='playing';$('ov').style.display='none';newPlay();cd=3;cdn=4;msgT=0;sfx.start()}
function endGameOld(){
  state='over';const nh=score>hi;if(nh){hi=score;try{localStorage.setItem('pg_hi',hi)}catch(e){}}sfx.over();hud();
  $('ov').style.display='flex';$('ov').innerHTML=`<div class="pn"><h1>GAME<br>OVER</h1><p>FINAL SCORE<br><span style="font-size:22px;color:#ffc857">${String(score).padStart(6,'0')}</span></p><p>REACHED LEVEL ${level}</p>${nh?'<p class="hs" style="animation:blink .6s steps(1) infinite">★ NEW HIGH SCORE ★</p>':''}<button class="btn" data-start>CONTINUE? ↻</button></div>`;
}
function loseLife(txt){
  lives--;combo=0;P.has=false;ball=null;shake=.4;sfx.hit();banner(txt,1.3,'#ff7a7a');hud();wait=1.3;
  after=lives<=0?endGame:()=>{down=1;fd=los+10*YD;newPlay();cd=3;cdn=4;banner('NEW SET OF DOWNS!',1,'#b9e66b')};
}
function tackled(){
  P.has=false;P.inv=1;combo=0;shake=.35;sfx.hit();burst(P.x,P.y,'#ffc857',14);down++;
  if(down>4)return loseLife('TURNOVER ON DOWNS!');
  banner('FLAG PULLED! '+['','','2ND','3RD','4TH'][down]+' DOWN',1.1,'#ffb36b');wait=1;
  after=()=>{los=clamp(P.x,F.x+60,GOAL-200);newPlay(true)};
}
function touchdown(){
  P.has=false;tds++;combo++;addPts(700,P.x-30,P.y-40,'TOUCHDOWN');level++;clock=Math.min(99,clock+6);flash=.5;hype=2.2;shake=.3;sfx.td();
  for(let i=0;i<50;i++)parts.push({x:rnd(F.x,F.x+F.w),y:F.y-10,vx:rnd(-40,40),vy:rnd(40,200),l:rnd(1,2),c:['#ffc857','#ff4fa3','#4de2ff','#b9e66b'][i%4],s:rnd(4,7),g:120});
  banner('TOUCHDOWN! +6 SEC',1.6,'#ffe45c');wait=1.7;
  after=()=>{los=F.x+90;fd=los+10*YD;down=1;newPlay();cd=3;cdn=4;banner('LEVEL '+level+' — GO!',1.1,'#4de2ff')};
}
function throwBall(i){
  if(state!=='playing'||paused||wait>0||cd>0||!P.has||ball)return;
  if(i==null){i=0;R.forEach((r,j)=>{if(r.gap+r.x*.1>R[i].gap+R[i].x*.1)i=j})}
  if(!R[i])return;tgt=i;P.has=false;ball={sx:P.x+10,sy:P.y-5,t:0,x:P.x,y:P.y};sfx.throw();
}
function juke(){if(state!=='playing'||paused||wait>0||cd>0||!P.has||P.jcd>0)return;P.jk=.22;P.jcd=1.4*SEL.jk;sfx.juke()}
function chase(dt,tk,fl){
  let nr=null;if(ball){nr=D[0];D.forEach(d=>{if(Math.hypot(d.x-R[tgt].x,d.y-R[tgt].y)<Math.hypot(nr.x-R[tgt].x,nr.y-R[tgt].y))nr=d})}
  D.forEach(d=>{
    if(d.stun>0){d.stun-=dt;return}
    let tx=P.x,ty=P.y;
    if(ball&&(d.role===tgt+2||d===nr)){tx=R[tgt].x;ty=R[tgt].y}
    else if(d.role===1&&Math.hypot(P.x-d.x,P.y-d.y)>120){tx=P.x+60}
    else if(d.role>1&&Math.hypot(P.x-d.x,P.y-d.y)>110){tx=R[d.role-2].x-22;ty=R[d.role-2].y}
    const sp=d.sp*(Math.hypot(B.x-d.x,B.y-d.y)<32?.5:1);
    const dist=Math.hypot(tx-d.x,ty-d.y);
    if(dist>3){d.x+=(tx-d.x)/dist*sp*dt;d.y+=(ty-d.y)/dist*sp*dt}
    d.x=clamp(d.x,F.x+25,F.x+F.w-20);d.y=clamp(d.y,F.y+20,F.y+F.h-20);
    if(tk&&P.has&&P.inv<=0&&Math.hypot(P.x-d.x,P.y-d.y)<26)tackled();
  });
}
function update(dt){
  t+=dt;
  parts=parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.l-=dt;return p.l>0});
  pops=pops.filter(p=>(p.l-=dt*.9)>0);
  if(msgT>0)msgT-=dt;if(flash>0)flash-=dt;if(shake>0)shake-=dt;if(hype>0)hype-=dt;
  if(state==='title'){P.x=los+80+Math.sin(t)*50;P.y=F.y+F.h/2+Math.cos(t*1.3)*60;D.forEach((d,i)=>{d.y=d.hy+Math.sin(t*1.5+i*2)*20;d.x+=Math.sin(t+i)*.4});return}
  if(state!=='playing'||paused)return;
  if(cd>0){cd-=dt;const n=Math.ceil(cd);if(n!==cdn&&n>0){cdn=n;tone(520,.12)}if(cd<=0){cd=0;banner('HIKE!',.8,'#b9e66b');sfx.start()}return}
  if(wait>0){wait-=dt;if(wait<=0&&after){const f=after;after=null;f()}return}
  clock-=dt;if(clock<=0){clock=0;endGame();return}
  if(ol&&ol.g){ol.tk=(ol.tk||0)+dt;if(ol.tk>1){ol.tk=0;ol.g.emit('st',{s:score}).catch(()=>{})}}
  if(P.inv>0)P.inv-=dt;
  const dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);
  const dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);
  const m=Math.hypot(dx,dy)||1,moving=dx||dy;
  if(moving)P.dir={x:dx/m,y:dy/m};
  const spr=keys.has('Shift')&&P.st>.02&&moving;
  P.st=clamp(P.st+(spr?-.45/SEL.st:.25*SEL.st)*dt,0,1);P.jcd=Math.max(0,P.jcd-dt);
  if(P.has||ball){
    if(P.jk>0){
      P.jk-=dt;P.x+=P.jd.x*520*dt;P.y+=P.jd.y*520*dt;P.inv=Math.max(P.inv,.08);
      parts.push({x:P.x,y:P.y,vx:0,vy:0,l:.25,c:'#4de2ff',s:10,g:0});
      D.forEach(d=>{if(d.stun<=0&&Math.hypot(d.x-P.x,d.y-P.y)<48){d.stun=1.1;addPts(50,d.x,d.y-32,'JUKE!');sfx.coin()}});
    }else{P.jd=moving?{x:dx/m,y:dy/m}:{x:1,y:0};const s=(spr?1.4:1)*SEL.spd;P.x+=dx/m*150*s*dt;P.y+=dy/m*125*s*dt}
    P.x=clamp(P.x,F.x+12,F.x+F.w-16);P.y=clamp(P.y,F.y+16,F.y+F.h-16);
    if(P.has)anc=P.x;R.forEach(r=>{r.ph+=dt;r.x=clamp(anc+r.ox+Math.sin(r.ph*r.fx)*r.ax,F.x+80,F.x+F.w-45);r.y=clamp(F.y+F.h*r.yb+Math.sin(r.ph*r.fy)*r.ay,F.y+25,F.y+F.h-25);r.gap=Math.min(...D.map(d=>Math.hypot(d.x-r.x,d.y-r.y)));r.open=r.gap>64});
    let nd=D[0];D.forEach(d=>{if(Math.hypot(d.x-P.x,d.y-P.y)<Math.hypot(nd.x-P.x,nd.y-P.y))nd=d});
    const bd=Math.hypot(nd.x-P.x,nd.y-P.y)||1,bk=Math.min(1,dt*8);B.x+=(P.x+(nd.x-P.x)/bd*42-B.x)*bk;B.y+=(P.y+(nd.y-P.y)/bd*42-B.y)*bk;
    
    coins.forEach((c,i)=>{if(Math.hypot(c.x-P.x,c.y-P.y)<22){coins.splice(i,1);addPts(25,c.x,c.y-14);sfx.coin();burst(c.x,c.y,'#ffc857',8,200)}});
    if(P.has&&P.x>=fd&&fd<GOAL){down=1;fd=P.x+10*YD;combo++;addPts(200,P.x,P.y-36,'1ST DOWN');sfx.down();banner('FIRST DOWN!',.9,'#b9e66b')}
    chase(dt,true,false);
    if(P.has&&P.x>=GOAL)touchdown();
  }
  if(ball){
    ball.t+=dt;const k=clamp(ball.t/.6,0,1);
    const tr=R[tgt];ball.x=ball.sx+(tr.x-ball.sx)*k;ball.y=ball.sy+(tr.y-ball.sy)*k-Math.sin(k*Math.PI)*65;
    
    if(k>=1){
      const near=Math.min(...D.map(d=>Math.hypot(d.x-R[tgt].x,d.y-R[tgt].y)));
      if(near<44){loseLife('INTERCEPTED!')}
      else{const r=R[tgt];P.x=r.x;P.y=r.y;P.has=true;P.inv=.35;ball=null;combo++;addPts(100,r.x,r.y-36,'CATCH');banner('CATCH! '+r.nm.toUpperCase(),.8,'#4de2ff');P.num=r.num;P.nm=r.nm;r.num=SEL.num;sfx.catch()}
    }
  }
  hud();
}
// ---- drawing
const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function text(s,x,y,size=10,c='#fff0c6',al='left'){ctx.font=`${size}px ${FONT}`;ctx.textAlign=al;ctx.fillStyle='#10131f';ctx.fillText(s,x+2,y+2);ctx.fillStyle=c;ctx.fillText(s,x,y)}
function sprite(x,y,jersey,num,flags,run,me){
  const l=run?Math.sin(t*14+x)*3:0;
  rect(x-11,y+14,22,5,'#0006');
  rect(x-7,y-17,14,7,'#e5b98c');rect(x-9,y-10,18,15,jersey);rect(x-12,y-7,4,12,jersey);rect(x+8,y-7,4,12,jersey);
  rect(x-7,y+5+l,5,9,'#f0d6a0');rect(x+2,y+5-l,5,9,'#f0d6a0');rect(x-8,y+13+l,7,4,'#26332c');rect(x+2,y+13-l,7,4,'#26332c');
  rect(x-8,y-21,16,7,'#f2d2a2');rect(x-6,y-24,12,4,me?'#1b3b7a':'#17251e');rect(x-5,y-18,3,2,'#17251e');rect(x+2,y-18,3,2,'#17251e');
  text(String(num),x,y+1,7,'#fff7d5','center');
  if(flags){rect(x-14,y-2,5,9,'#ffc857');rect(x+10,y-2,5,9,'#ffc857')}
}
function draw(){
  ctx.save();if(shake>0)ctx.translate(rnd(-1,1)*shake*14,rnd(-1,1)*shake*14);
  rect(-20,-20,W+40,H+40,'#12182b');
  const cc=['#e6bd56','#d95d4f','#b7d879','#78b6ce'];
  for(let x=0;x<W;x+=16){const b=hype>0?Math.sin(t*10+x)*4:0,c=hype>0&&((x>>4)+Math.floor(t*8))%2?'#fff0c6':cc[(x>>4)%4];rect(x,8+b,8,14,c);rect(x,H-22-b,8,14,c)}
  for(let y=25;y<H-24;y+=16){rect(8,y,13,8,'#395070');rect(W-21,y,13,8,'#395070')}
  rect(F.x,F.y,F.w,F.h,'#277648');
  for(let x=F.x;x<F.x+F.w;x+=72)rect(x,F.y,36,F.h,'#2c8050');
  rect(F.x,F.y,58,F.h,'#b74d42');rect(F.x+F.w-58,F.y,58,F.h,'#b74d42');
  for(let y=F.y;y<F.y+F.h;y+=22){rect(F.x,y,58,2,'#d96a58');rect(F.x+F.w-58,y,58,2,'#d96a58')}
  text('HOME',F.x+29,F.y+F.h/2,8,'#fff0c6','center');
  const g=.6+.4*Math.sin(t*6);ctx.globalAlpha=g;text('TD',F.x+F.w-29,F.y+F.h/2,14,'#fff0c6','center');ctx.globalAlpha=1;
  for(let i=1;i<10;i++){const x=F.x+i*F.w/10;rect(x,F.y,2,F.h,'#b3d8a0');for(let y=F.y+25;y<F.y+F.h-15;y+=48){rect(x-7,y,5,2,'#c6e2ae');rect(x+4,y,5,2,'#c6e2ae')}if(i!==5)text(String(i*10),x,F.y+19,8,'#d8e8c4','center')}
  rect(F.x,F.y+F.h/2,F.w,2,'#b3d8a0');
  if(state!=='title'){rect(los,F.y,3,F.h,'#4aa8ffaa');if(fd<GOAL){rect(fd,F.y,4,F.h,'#ffe45c');text('1ST',fd,F.y+F.h-8,7,'#ffe45c','center')}}
  coins.forEach(c=>{const w=Math.abs(Math.cos(t*4+c.x))*10+2,y=c.y-Math.sin(t*5+c.x)*2;rect(c.x-w/2,y-6,w,12,'#ffc857');rect(c.x-w/2+1,y-4,Math.max(1,w-4),8,'#fff0a0')});
  if(P){
    if(P.has&&!ball&&state==='playing'){ctx.setLineDash([5,7]);ctx.lineWidth=2;R.forEach(r=>{ctx.strokeStyle=r.open?'#d7ef8b':'#ed9d7255';ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(r.x,r.y);ctx.stroke()});ctx.setLineDash([])}
    if(cd>0&&state==='playing'){
      ctx.lineWidth=3;ctx.setLineDash([8,6]);
      R.forEach((r,i)=>{const col=['#4de2ff','#ff4fa3','#b9e66b'][i];ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(r.x,r.y);let ex=r.x,ey=r.y;for(let s=0;s<=4;s+=.1){ex=clamp(P.x+r.ox+Math.sin((r.ph+s)*r.fx)*r.ax,F.x+80,F.x+F.w-45);ey=clamp(F.y+F.h*r.yb+Math.sin((r.ph+s)*r.fy)*r.ay,F.y+25,F.y+F.h-25);ctx.lineTo(ex,ey)}ctx.stroke();rect(ex-5,ey-5,10,10,col)});
      ctx.setLineDash([]);
    }
    const ents=[];
    R.forEach((r,i)=>ents.push({y:r.y,f:()=>{sprite(r.x,r.y,'#8fc0ff',r.num,false,true);if(P.has&&state==='playing'&&!ball)text((i+1)+(r.open?' OPEN':''),r.x,r.y-32,8,r.open?'#e4ff8d':'#ed9d72','center')}}));
    ents.push({y:B.y,f:()=>sprite(B.x,B.y,'#2f5fb0',55,false,true)});
    D.forEach((d,i)=>ents.push({y:d.y,f:()=>{sprite(d.x,d.y,'#e5c44e',i+21,true,d.stun<=0);if(d.stun>0)for(let k=0;k<3;k++)rect(d.x+Math.cos(t*8+k*2.1)*12,d.y-30+Math.sin(t*8+k*2.1)*4,4,4,'#fff')}}));
    ents.push({y:P.y,f:()=>{
      ctx.globalAlpha=P.inv>0&&Math.floor(t*20)%2?.45:1;sprite(P.x,P.y,SEL.c,P.num,P.has,state==='playing'&&P.has);ctx.globalAlpha=1;
      if(P.has){rect(P.x+8,P.y-9,10,6,'#8c4b27');rect(P.x+11,P.y-8,4,1,'#f8e4b2')}
      if(state==='playing')text(P.nm||'',P.x,P.y-32,7,'#4de2ff','center')}});
    ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
    if(ball){rect(ball.x-5,ball.y-3,10,6,'#8c4b27');rect(ball.x-1,ball.y-2,3,1,'#f8e4b2');rect(ball.x-4,ball.y+16,8,3,'#0005')}
  }
  parts.forEach(p=>{ctx.globalAlpha=clamp(p.l*2,0,1);rect(p.x,p.y,p.s,p.s,p.c)});ctx.globalAlpha=1;
  pops.forEach(p=>{ctx.globalAlpha=clamp(p.l*2,0,1);text(p.s,p.x,p.y-(1-p.l)*34,9,p.c,'center')});ctx.globalAlpha=1;
  if(state==='playing'||state==='over'){
    rect(F.x+10,F.y+F.h-40,112,32,'#070918cc');
    text('SPRINT',F.x+16,F.y+F.h-28,6,'#b9e66b');rect(F.x+16,F.y+F.h-25,100*P.st,5,'#b9e66b');
    text('JUKE',F.x+16,F.y+F.h-12,6,P.jcd>0?'#8e9ac8':'#ff4fa3');rect(F.x+16,F.y+F.h-9,100*(1-P.jcd/(1.4*SEL.jk)),5,P.jcd>0?'#8e9ac8':'#ff4fa3');
    if(combo>0)text('COMBO ×'+mult(),F.x+F.w-12,F.y+F.h-12,10,'#ffe45c','right');
    if(ol&&ol.theirs!=null)text('BEAT '+ol.theirs,F.x+F.w-12,F.y+22,9,'#ff4fa3','right');
  }
  if(msgT>0){ctx.font=`13px ${FONT}`;const w=ctx.measureText(msg).width+40;rect(W/2-w/2-4,21,w+8,34,'#e8d7a3');rect(W/2-w/2,25,w,26,'#10142d');text(msg,W/2,45,13,msgC,'center')}
  if(cd>0&&state==='playing'){
    rect(W/2-160,F.y+F.h-64,320,58,'#070918ee');
    R.forEach((r,i)=>text((i+1)+' '+r.nm.toUpperCase()+' - '+SV.plan[i],W/2-146,F.y+F.h-44+i*15,8,['#4de2ff','#ff4fa3','#b9e66b'][i]));
    text('YOUR ROUTES',W/2,F.y+60,12,'#fff0c6','center');
    ctx.globalAlpha=.6+.4*Math.sin(t*10);text(String(Math.ceil(cd)),W/2,H/2+30,80,'#ffe45c','center');ctx.globalAlpha=1;
  }
  if(paused){rect(0,0,W,H,'#06091add');text('PAUSED',W/2,H/2,30,'#ffc857','center');text('PRESS P TO RESUME',W/2,H/2+40,10,'#fff0c6','center')}
  if(flash>0){ctx.globalAlpha=flash;rect(0,0,W,H,'#fff7c6');ctx.globalAlpha=1}
  ctx.restore();
}
function loop(ts){const dt=Math.min((ts-last)/1000||0,.035);last=ts;update(dt);draw();requestAnimationFrame(loop)}
// ---- input
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT/.test(e.target.tagName))return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  keys.add(k);
  if(k===' '){if(state==='playing')throwBall();else if(state==='over'&&!ol)startGame()}
  if(k==='Enter'&&state==='over'&&!ol)startGame();
  if(k==='x'||k==='z'||k==='j')juke();
  if(state==='playing'&&(k==='1'||k==='2'||k==='3'))throwBall(+k-1);
  if(k==='p'&&state==='playing')paused=!paused;
  if(k==='r'&&state==='playing'&&!ol)startGame();
  if(k==='m')muted=!muted;
});
document.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
$('tp').addEventListener('pointerdown',e=>{e.preventDefault();throwBall()});
$('tj').addEventListener('pointerdown',e=>{e.preventDefault();juke()});
let ptr=null;
const pt=e=>({x:e.offsetX*W/cv.clientWidth,y:e.offsetY*H/cv.clientHeight});
cv.addEventListener('pointerdown',e=>{if(state!=='playing')return;const q=pt(e),i=R.findIndex(r=>Math.hypot(r.x-q.x,r.y-q.y)<45);if(i>=0&&P.has&&!ball){throwBall(i);return}ptr=q});
cv.addEventListener('pointermove',e=>{if(!ptr||state!=='playing'||!P.has||wait>0||cd>0||paused)return;const q=pt(e);P.x=clamp(P.x+(q.x-ptr.x)*.8,F.x+12,F.x+F.w-16);P.y=clamp(P.y+(q.y-ptr.y)*.8,F.y+16,F.y+F.h-16);ptr=q});
cv.addEventListener('pointerup',()=>{ptr=null});
fd=los+10*YD;newPlay();hud();requestAnimationFrame(loop);
})();
</script>
